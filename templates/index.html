<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R ChatBoot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header>
        🤖 R ChatBoot 
        <div class="subtitle">
            Your Intelligent AI Assistant
        </div>
    </header>

    <div class="container">

        <div class="chat-area" id="chatArea">
            <div class="message bot">مرحباً بك في R ChatBoot👋 أنا مساعدك الذكي، كيف يمكنني مساعدتك اليوم؟</div>
        </div>

        <div class="input-area">
            <textarea
                id="question"
                placeholder="  دردش معي..."
            ></textarea>
            <button type="button" id="sendBtn" onclick="sendMessage()">إرسال</button>
        </div>

        <button type="button" class="new-chat" onclick="newChat()">
            🔄 محادثة جديدة
        </button>

        <div class="status" id="status">
            Powered by Raheeb AI Engine
        </div>

    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
